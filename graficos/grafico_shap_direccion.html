<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
body{font-family:'Roboto Mono',monospace;margin:0;padding:14px;background:#ffffff;color:#212B3F;}
.dashboard-card{border:1px solid #cbd5e1;border-radius:10px;padding:16px 20px 12px 20px;box-shadow:0 4px 12px rgba(33,43,63,0.06);background:#fff;}
.filter-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #e2e8f0;margin-bottom:10px;}
.filter-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:#64748b;}
.chips-group{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-family:'Roboto Mono',monospace;font-size:11.5px;font-weight:500;padding:5px 12px;border-radius:16px;border:1.5px solid #cbd5e1;background:#f8fafc;color:#334155;cursor:pointer;user-select:none;transition:all 0.15s ease;}
.chip:hover{border-color:#212B3F;}.chip.active{background:#212B3F;color:#fff;border-color:#212B3F;}
.filter-select{min-width:220px;padding:6px 12px;font-family:'Roboto Mono',monospace;font-size:12px;color:#212B3F;border:1.5px solid #212B3F;border-radius:6px;background:#f8fafc;cursor:pointer;}
.chart{width:100%;}
.chart-footer{font-family:'Literata',Georgia,serif;font-size:12px;color:#64748b;margin-top:6px;padding-left:4px;}
.chart-note{font-family:'Literata',Georgia,serif;font-style:italic;font-size:11.5px;color:#64748b;margin-top:4px;padding-left:4px;line-height:1.45;}
</style></head><body><div class="dashboard-card">
<div class="filter-bar"><span class="filter-label">Ver por:</span><div class="chips-group" id="chips">
<div class="chip active" data-g="empresas" onclick="sel(this)">Empresa</div><div class="chip" data-g="banderas" onclick="sel(this)">Bandera</div></div></div>
<div id="chart-dir" class="chart" style="height:600px;"></div>
<div class="chart-footer">Fuente: Kevin Pagnotta en base a SEPA</div><div class="chart-note">Nota: valor SHAP medio de cada variable en puntos de brecha. Verde: la variable sube la brecha predicha respecto del promedio del modelo; rojo: la baja.</div></div>
<script>
const D={"banderas": {"z": [[-0.0, -0.001, -0.006, -0.006, -0.035, -0.025, -0.004, -0.013, 0.002, -0.028, 0.009, -0.404, -0.356, -0.008, 0.053], [0.0, 0.001, 0.012, 0.027, -0.018, 0.01, -0.001, 0.016, 0.003, 0.337, -0.002, 0.663, 0.42, 0.004, -0.096], [0.0, 0.0, 0.01, 0.009, -0.168, 0.005, -0.002, -0.002, 0.006, -0.027, 0.006, -0.598, 0.316, -0.004, 0.007], [0.0, 0.003, 0.025, 0.045, 0.684, -0.013, -0.0, -0.01, 0.004, 0.287, 0.001, 1.057, 0.717, 0.001, -0.097], [-0.0, -0.005, -0.026, -0.025, -0.19, -0.005, -0.001, -0.0, 0.011, -0.017, 0.002, -0.588, -0.448, -0.007, 0.047], [-0.0, 0.0, 0.002, -0.023, -0.038, -0.004, -0.003, -0.005, 0.008, -0.013, -0.021, 0.012, 0.362, 0.019, -0.009], [-0.0, -0.001, -0.01, -0.025, -0.021, 0.003, -0.004, -0.007, 0.007, -0.017, -0.014, -0.325, 0.354, 0.023, 0.002], [0.0, 0.001, 0.005, -0.016, 0.433, -0.011, -0.001, -0.01, 0.006, 0.136, -0.008, 0.896, 0.686, 0.029, -0.076], [-0.0, -0.0, -0.001, -0.021, -0.231, 0.003, 0.0, -0.014, 0.005, -0.026, -0.011, 0.425, 0.569, 0.007, -0.018], [0.0, -0.002, -0.026, -0.023, -0.037, -0.011, -0.003, 0.002, 0.014, -0.023, -0.001, -0.49, -0.419, 0.032, 0.045], [-0.0, -0.002, -0.025, -0.024, -0.002, -0.012, -0.002, 0.002, 0.014, -0.021, -0.001, 0.002, -0.407, 0.032, 0.018]], "filas": ["DIA", "Carrefour Express", "Carrefour Market", "Disco", "SuperChangomas", "Coto", "Carrefour Hiper", "Jumbo", "Vea", "Changomas", "HiperChangomas"], "obs": [-2.39, 2.53, -2.01, 6.53, -4.77, 0.08, -1.18, 5.86, 1.04, -3.24, -1.25]}, "empresas": {"z": [[0.0, 0.001, 0.01, 0.021, -0.034, 0.009, -0.001, 0.012, 0.004, 0.27, -0.002, 0.45, 0.404, 0.005, -0.077], [0.0, 0.002, 0.014, 0.013, 0.417, -0.009, -0.0, -0.011, 0.005, 0.177, -0.004, 0.876, 0.676, 0.011, -0.074], [-0.0, -0.003, -0.026, -0.024, -0.059, -0.01, -0.002, 0.002, 0.014, -0.021, -0.0, -0.336, -0.421, 0.023, 0.036], [-0.0, 0.0, 0.002, -0.023, -0.038, -0.004, -0.003, -0.005, 0.008, -0.013, -0.021, 0.012, 0.362, 0.019, -0.009], [-0.0, -0.001, -0.006, -0.006, -0.035, -0.025, -0.004, -0.013, 0.002, -0.028, 0.009, -0.404, -0.356, -0.008, 0.053]], "filas": ["Carrefour", "Cencosud", "ChangoMás", "Coto", "DIA"], "obs": [1.75, 5.17, -2.87, 0.08, -2.39]}};const COLS=["Latitud", "Longitud", "Decil de ingreso", "Rivales a 1 km", "Sucursal", "Categoría", "Importado", "N° de productos", "Concentración de marca", "Dispersión intra-cadena", "Dispersión entre cadenas", "Bandera", "Empresa", "Formato", "Mes del año"];const BLC=["Territorial", "Territorial", "Territorial", "Territorial", "Territorial", "Negocio", "Negocio", "Negocio", "Negocio", "Negocio", "Negocio", "Cadena", "Cadena", "Cadena", "Calendario"];
const LIM=1.1;let g='empresas';const CR={"DIA": "#A60321", "Carrefour Express": "#212B3F", "Carrefour Market": "#212B3F", "Carrefour Hiper": "#212B3F", "Carrefour Maxi": "#212B3F", "Maxi": "#212B3F", "Coto": "#D97B66", "Jumbo": "#85BAEA", "Disco": "#85BAEA", "Vea": "#85BAEA", "Changomas": "#6C8547", "HiperChangomas": "#6C8547", "SuperChangomas": "#6C8547", "Carrefour": "#212B3F", "Cencosud": "#85BAEA", "ChangoMás": "#6C8547"};
const fmt=v=>{const r=Math.round(v*100)/100;return (r===0?0:r).toFixed(2).replace('.',',').replace('-','−');};
function sel(el){document.querySelectorAll('#chips .chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');g=el.getAttribute('data-g');render();}
function render(){
 const d=D[g];const X=COLS;
 const z=d.z;
 const txt=d.z.map(r=>r.map(fmt));
 const hov=d.z.map((r,i)=>r.map((v,j)=>'<b>'+d.filas[i]+'</b><br>'+COLS[j]+' ('+BLC[j]+')<br>Contribución media: '+fmt(v)+' pts'));
 const tr={type:'heatmap',x:X,y:d.filas,z:z,zmin:-LIM,zmax:LIM,zmid:0,xgap:2,ygap:2,
  colorscale:[[0,'#A60321'],[0.25,'#D28190'],[0.5,'#F4F4F5'],[0.75,'#B6C2A3'],[1,'#6C8547']],
  text:txt,texttemplate:'%{text}',textfont:{size:10.5},hovertext:hov,hoverinfo:'text',
  colorbar:{title:{text:'pts',side:'right'},thickness:10,len:0.6,tickformat:'.1f',outlinewidth:0}};
 const shapes=[],ann=[];let j0=0;
 const bl=[...new Set(BLC)];const C={"Cadena": "#212B3F", "Negocio": "#646B79", "Territorial": "#9BA0A9", "Calendario": "#D3D5D9"};
 bl.forEach(b=>{const n=BLC.filter(x=>x===b).length;ann.push(n===1?{x:j0-0.45,y:1.02,xref:'x',yref:'paper',xanchor:'left',yanchor:'bottom',text:'<b>'+b+'</b>',showarrow:false,font:{size:11,color:'#212B3F'}}:{x:(j0+j0+n-1)/2,y:1.02,xref:'x',yref:'paper',yanchor:'bottom',text:'<b>'+b+'</b>',showarrow:false,font:{size:11,color:'#212B3F'}});
  shapes.push({type:'line',xref:'x',yref:'paper',x0:j0-0.45,x1:j0+n-1+0.45,y0:1.005,y1:1.005,line:{color:C[b],width:4}});j0+=n;});
 const t='¿Qué variables suben y cuáles bajan la brecha de cada '+(g==='banderas'?'bandera':'empresa')+'?';
 const s='Dirección y contribución promedio de cada variable para predecir Octubre 2026';
 const layout={font:{family:"'Roboto Mono', monospace",size:11,color:'#212B3F'},plot_bgcolor:'white',paper_bgcolor:'white',separators:',.',
hoverlabel:{font:{family:"'Roboto Mono', monospace",size:11}},title:{text:`<span style="font-family:'Literata', Georgia, serif; font-weight:600; font-size:17px; color:#212B3F;">${t}</span><br><span style="font-family:'Literata', Georgia, serif; font-weight:400; font-size:13px; color:#64748b;">${s}</span>`,x:0.01,y:0.98,yanchor:'top'},shapes:shapes,annotations:ann,
  xaxis:{side:'bottom',tickangle:-40,tickfont:{size:10.5},showgrid:false},
  yaxis:{autorange:'reversed',automargin:true,tickfont:{size:11.5},showgrid:false,tickmode:'array',tickvals:d.filas,ticktext:d.filas.map(f=>'<span style="color:'+CR[f]+'"><b>'+f+'</b></span>')},
  margin:{l:20,r:20,t:110,b:150}};
 Plotly.react('chart-dir',[tr],layout,{responsive:true,displayModeBar:false});}
render();
</script></body></html>
