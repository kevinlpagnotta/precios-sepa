function fmtPct(v){return(v===null||v===undefined||isNaN(v))?'—':v.toFixed(2).replace('.',',')+'%';}
function fmtInt(v){return(v===null||v===undefined||isNaN(v)||v===0)?'—':v.toLocaleString('es-AR');}
let modo='misma',cadSel='Total';const SUB={misma:'Mismo producto en la misma cadena: cada formato (por ejemplo, Carrefour Express o Disco) se compara contra sí mismo entre partidos y dentro de cada partido. Cadena = promedio de sus formatos; Total = promedio de las cadenas. Precios idénticos: diferencia de hasta 0,25%.',entre:'Mismo producto en distintas cadenas del mismo formato: supermercados (DIA, Carrefour Express, Carrefour Market, Disco, SuperChangomas) contra supermercados e hipermercados (Coto, Carrefour Hiper, Jumbo, Vea, Changomas, HiperChangomas) contra hipermercados. El precio de cada cadena se compara con el promedio de las cadenas de su formato que venden ese producto, en el mismo partido o en el conjunto del AMBA. Sin Maxi ni Lanús. Total = promedio de las cadenas. Precios idénticos: diferencia de hasta 0,25%.'};const HDR={misma:['Distintos partidos','Mismo partido'],entre:['Distintos partidos','Mismo partido']};function seleccionarModo(el){document.querySelectorAll('#chips-modo .chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');modo=el.getAttribute('data-modo');renderizarTabla(cadSel);}function seleccionarCadena(el){document.querySelectorAll('#chips-cadenas .chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');cadSel=el.getAttribute('data-cad');renderizarTabla(cadSel);}

const filas=[{nombre:'Cantidad de precios idénticos (%)',c1:fmtPct(d23.p_id),c2:fmtPct(d23.i_id),c3:fmtPct(d26.p_id),c4:fmtPct(d26.i_id),esSku:false},{nombre:'Diferencia de precios mediana (%)',c1:fmtPct(d23.p_med),c2:fmtPct(d23.i_med),c3:fmtPct(d26.p_med),c4:fmtPct(d26.i_med),esSku:false},{nombre:'Diferencia de precios promedio (%)',c1:fmtPct(d23.p_prom),c2:fmtPct(d23.i_prom),c3:fmtPct(d26.p_prom),c4:fmtPct(d26.i_prom),esSku:false},{nombre:'Desvío de precios (%)',c1:fmtPct(d23.p_std),c2:fmtPct(d23.i_std),c3:fmtPct(d26.p_std),c4:fmtPct(d26.i_std),esSku:false},{nombre:'SKUs comparados',c1:fmtInt(d23.p_skus),c2:fmtInt(d23.i_skus),c3:fmtInt(d26.p_skus),c4:fmtInt(d26.i_skus),esSku:true}];
