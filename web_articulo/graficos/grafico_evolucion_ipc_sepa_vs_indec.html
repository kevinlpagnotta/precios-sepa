function renderIPC() {
  const sel = selEl.value;

  const diccSEPA = esMensual ? seriesSEPAMensual : seriesSEPAInteranual;
  const yINDEC   = esMensual ? serieINDECMensual : serieINDECInteranual;

  const idxInicio = esMensual ? 0 : 11;
  const xISO = fechasISO.slice(idxInicio);
  const xTXT = fechasTXT.slice(idxInicio);
  const ySEPA = (diccSEPA[sel] || []).slice(idxInicio);
  const yIND  = yINDEC.slice(idxInicio);

  const ticksX_ISO = xISO.filter((_, i) => i % 6 === 0);
  const ticksX_TXT = xTXT.filter((_, i) => i % 6 === 0);

  const etiquetaSEPA = sel === 'Total GBA' ? 'SEPA-GBA' : `SEPA (${sel})`;
  const textoSubtitulo = esMensual ? 'Variación mensual' : 'Variación interanual';
  const textoEjeY = esMensual ? 'Variación mensual (%)' : 'Variación interanual (%)';

  const traces = [
    {
      x: xISO,
      y: ySEPA,
      mode: 'lines+markers',
      name: `${etiquetaSEPA}   `,
      connectgaps: true,
      line: { color: '#212B3F', width: 3.0, shape: 'spline', smoothing: 0.45 },
      marker: { size: 5.5, color: '#212B3F', line: { width: 1, color: '#ffffff' } },
      customdata: xTXT,
      hovertemplate: `<b>${etiquetaSEPA}</b> (%{customdata}): <b>%{y:.2f}%</b><extra></extra>`
    },
    {
      x: xISO,
      y: yIND,
      mode: 'lines+markers',
      name: 'INDEC-GBA',
      line: { color: '#A60321', width: 2.5, dash: 'dot', shape: 'spline', smoothing: 0.45 },
      marker: { size: 5.0, color: '#A60321', line: { width: 1, color: '#ffffff' } },
      customdata: xTXT,
      hovertemplate: `<b>INDEC-GBA</b> (%{customdata}): <b>%{y:.1f}%</b><extra></extra>`
    }
  ];

  if (sel !== 'Total GBA') {
    traces.splice(1, 0, {
      x: xISO,
      y: (diccSEPA['Total GBA'] || []).slice(idxInicio),
      mode: 'lines',
      name: 'SEPA-GBA (Promedio)   ',
      line: { color: '#85BAEA', width: 2.0, shape: 'spline', smoothing: 0.45 },
      customdata: xTXT,
      hovertemplate: `<b>SEPA-GBA</b> (%{customdata}): <b>%{y:.2f}%</b><extra></extra>`

      x: 0.01, y: 0.96, yanchor: 'top'
